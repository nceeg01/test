name: Deploy XCT resume MVPs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install && npm test && npm run build
        working-directory: resume-mvps/apps/voice-agent
      - run: npm install && npm test && npm run build
        working-directory: resume-mvps/apps/media-etl
      - run: pip install pytest && cd resume-mvps && pytest -q services/media_etl/tests
      - run: |
          mkdir -p public/voice-agent public/media-etl
          cp -r resume-mvps/apps/voice-agent/dist/* public/voice-agent/
          cp -r resume-mvps/apps/media-etl/dist/* public/media-etl/
          cat > public/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yubraj resume MVPs</title><body><main><h1>Yubraj Chaulagain — Resume MVPs</h1><p><a href="voice-agent/">Customer Service RAG Agent</a></p><p><a href="media-etl/">Media ETL Pipeline</a></p></main></body></html>
          HTML
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
